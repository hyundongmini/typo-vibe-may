<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 26 — 빗방울 피아노</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  font-family:'Pretendard',-apple-system,sans-serif;
}
canvas{display:block;width:100%;height:100%}

.title{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(24px,5vw,48px);
  font-weight:200;
  color:rgba(255,255,255,0.15);
  letter-spacing:0.3em;
  pointer-events:none;
  z-index:1;
  text-align:center;
  line-height:1.6;
}

.hint{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  font-size:13px;color:rgba(255,255,255,0.4);
  pointer-events:none;z-index:10;
}

.day-tag{
  position:fixed;bottom:14px;right:18px;
  font:11px/1 monospace;color:rgba(255,255,255,0.2);
  z-index:10;
}

/* 물방울 퍼지는 효과 */
.ripple{
  position:fixed;
  border:2px solid rgba(255,255,255,0.6);
  border-radius:50%;
  pointer-events:none;
  animation:ripple-out 0.8s ease-out forwards;
}
@keyframes ripple-out{
  0%{transform:translate(-50%,-50%) scale(0);opacity:1}
  100%{transform:translate(-50%,-50%) scale(3);opacity:0}
}
</style>
</head>
<body>

<div class="title">빗방울을<br>연주하세요</div>
<div class="hint">빗방울을 클릭하면 소리가 나요</div>
<canvas id="c"></canvas>
<div class="day-tag">day 26 / typo-vibe</div>

<script>
// ===== 캔버스 설정 =====
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = innerWidth * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
resize();
window.addEventListener('resize', resize);

// ===== 오디오 컨텍스트 =====
let audioCtx;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// 피아노 음계 (C4 ~ C6, 펜타토닉 스케일로 더 아름답게)
const pentatonic = [
  261.63, 293.66, 329.63, 392.00, 440.00,  // C4, D4, E4, G4, A4
  523.25, 587.33, 659.25, 783.99, 880.00,  // C5, D5, E5, G5, A5
  1046.50, 1174.66, 1318.51                 // C6, D6, E6
];

function playNote(freq, x) {
  if (!audioCtx) return;
  
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  
  // 부드러운 피아노 같은 소리
  osc.type = 'sine';
  osc.frequency.value = freq;
  
  // 하모닉 추가 (더 풍부한 소리)
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;
  const gain2 = audioCtx.createGain();
  gain2.gain.value = 0.15;
  
  filter.type = 'lowpass';
  filter.frequency.value = 2000;
  
  // 엔벨로프 (피아노처럼 빠른 어택, 긴 릴리즈)
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 2);
  
  gain2.gain.setValueAtTime(0, now);
  gain2.gain.linearRampToValueAtTime(0.05, now + 0.02);
  gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
  
  osc.connect(filter);
  osc2.connect(gain2);
  gain2.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start(now);
  osc2.start(now);
  osc.stop(now + 2);
  osc2.stop(now + 2);
}

// ===== 빗방울 클래스 =====
class Raindrop {
  constructor() {
    this.reset();
  }
  
  reset() {
    this.x = Math.random() * innerWidth;
    this.y = -20 - Math.random() * 100;
    this.speed = 2 + Math.random() * 3;
    this.size = 8 + Math.random() * 12;
    this.opacity = 0.4 + Math.random() * 0.4;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.02 + Math.random() * 0.02;
    this.clicked = false;
  }
  
  update() {
    if (this.clicked) return false;
    
    this.y += this.speed;
    this.wobble += this.wobbleSpeed;
    this.x += Math.sin(this.wobble) * 0.3;
    
    if (this.y > innerHeight + 50) {
      this.reset();
    }
    return true;
  }
  
  draw() {
    if (this.clicked) return;
    
    const x = this.x;
    const y = this.y;
    const size = this.size;
    
    // 물방울 그라데이션
    const grad = ctx.createRadialGradient(
      x - size * 0.2, y - size * 0.3, 0,
      x, y, size
    );
    grad.addColorStop(0, `rgba(200, 220, 255, ${this.opacity})`);
    grad.addColorStop(0.5, `rgba(100, 150, 220, ${this.opacity * 0.7})`);
    grad.addColorStop(1, `rgba(50, 100, 180, ${this.opacity * 0.3})`);
    
    ctx.beginPath();
    // 물방울 모양 (위가 뾰족한 타원)
    ctx.moveTo(x, y - size * 1.2);
    ctx.bezierCurveTo(
      x + size * 0.8, y - size * 0.5,
      x + size * 0.8, y + size * 0.5,
      x, y + size * 0.7
    );
    ctx.bezierCurveTo(
      x - size * 0.8, y + size * 0.5,
      x - size * 0.8, y - size * 0.5,
      x, y - size * 1.2
    );
    ctx.fillStyle = grad;
    ctx.fill();
    
    // 하이라이트
    ctx.beginPath();
    ctx.ellipse(x - size * 0.2, y - size * 0.3, size * 0.15, size * 0.1, -0.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.8})`;
    ctx.fill();
  }
  
  contains(px, py) {
    const dx = px - this.x;
    const dy = py - this.y;
    return Math.sqrt(dx * dx + dy * dy) < this.size * 1.5;
  }
}

// ===== 물결 효과 =====
const ripples = [];

class Ripple {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.radius = 0;
    this.maxRadius = 80 + Math.random() * 40;
    this.opacity = 0.8;
    this.color = color;
  }
  
  update() {
    this.radius += 3;
    this.opacity -= 0.02;
    return this.opacity > 0;
  }
  
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${this.color}, ${this.opacity})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // 안쪽 원
    if (this.radius > 20) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${this.color}, ${this.opacity * 0.5})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

// ===== 배경 빗줄기 =====
const bgRaindrops = [];
for (let i = 0; i < 100; i++) {
  bgRaindrops.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    length: 10 + Math.random() * 20,
    speed: 8 + Math.random() * 8,
    opacity: 0.1 + Math.random() * 0.15
  });
}

function drawBgRain() {
  ctx.strokeStyle = 'rgba(150, 180, 220, 0.15)';
  ctx.lineWidth = 1;
  
  bgRaindrops.forEach(drop => {
    ctx.beginPath();
    ctx.moveTo(drop.x, drop.y);
    ctx.lineTo(drop.x - 1, drop.y + drop.length);
    ctx.stroke();
    
    drop.y += drop.speed;
    if (drop.y > innerHeight + drop.length) {
      drop.y = -drop.length;
      drop.x = Math.random() * innerWidth;
    }
  });
}

// ===== 메인 빗방울들 =====
const raindrops = [];
const RAINDROP_COUNT = 25;

for (let i = 0; i < RAINDROP_COUNT; i++) {
  const drop = new Raindrop();
  drop.y = Math.random() * innerHeight; // 초기 분산
  raindrops.push(drop);
}

// ===== 클릭 이벤트 =====
canvas.addEventListener('click', (e) => {
  initAudio();
  
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX;
  const y = e.clientY;
  
  // 클릭한 빗방울 찾기
  for (let i = raindrops.length - 1; i >= 0; i--) {
    const drop = raindrops[i];
    if (drop.contains(x, y) && !drop.clicked) {
      drop.clicked = true;
      
      // x 위치에 따른 음계 선택
      const noteIndex = Math.floor((x / innerWidth) * pentatonic.length);
      const freq = pentatonic[Math.min(noteIndex, pentatonic.length - 1)];
      playNote(freq, x);
      
      // 물결 효과
      const hue = 200 + (noteIndex / pentatonic.length) * 60;
      ripples.push(new Ripple(drop.x, drop.y, `180, 200, 255`));
      ripples.push(new Ripple(drop.x, drop.y + 10, `150, 180, 230`));
      
      // 잠시 후 리셋
      setTimeout(() => drop.reset(), 100);
      
      // 타이틀 숨기기
      document.querySelector('.title').style.opacity = '0';
      document.querySelector('.hint').style.opacity = '0';
      
      break;
    }
  }
});

// 터치 지원
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const clickEvent = new MouseEvent('click', {
    clientX: touch.clientX,
    clientY: touch.clientY
  });
  canvas.dispatchEvent(clickEvent);
});

// ===== 애니메이션 루프 =====
function animate() {
  // 배경
  ctx.fillStyle = 'rgba(15, 20, 40, 0.3)';
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  
  // 배경 빗줄기
  drawBgRain();
  
  // 물결 효과
  for (let i = ripples.length - 1; i >= 0; i--) {
    if (!ripples[i].update()) {
      ripples.splice(i, 1);
    } else {
      ripples[i].draw();
    }
  }
  
  // 빗방울
  raindrops.forEach(drop => {
    drop.update();
    drop.draw();
  });
  
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
