<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Press Conference Camera Filter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Video background layer - 숨김 (canvas가 대신함) */
    #video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror effect */
      display: none; /* Canvas가 대신 렌더링 */
    }

    /* Canvas overlay for effects */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      transform: scaleX(-1); /* Mirror effect */
    }

    /* Speech bubble */
    .speech-bubble {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: #fff;
      border: 3px solid #000;
      border-radius: 20px;
      padding: 20px 30px;
      font-size: 32px;
      font-weight: 900;
      color: #000;
      white-space: nowrap;
      box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.3);
      z-index: 10;
      animation: bubblePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes bubblePop {
      0% {
        transform: translateX(-50%) scale(0) rotate(-10deg);
        opacity: 0;
      }
      50% {
        transform: translateX(-50%) scale(1.1) rotate(5deg);
      }
      100% {
        transform: translateX(-50%) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 30px;
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 0 solid transparent;
      border-top: 15px solid #fff;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 27px;
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 0 solid transparent;
      border-top: 18px solid #000;
    }

    /* Microphone container - 이미지 끝이 화면 끝에 맞닿도록 */
    .microphone-container {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 800px;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .microphone {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      animation: micRise 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .microphone img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes micRise {
      0% {
        transform: translateY(100%);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Floating animation */
    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotateZ(0deg);
      }
      50% {
        transform: translateY(-8px) rotateZ(1deg);
      }
    }

    .microphone.floating {
      animation: micRise 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, float 2s ease-in-out 0.5s infinite;
    }

    /* Background image layer - 사람 뒤에 보이도록 */
    .bg-layer {
      position: fixed;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('./BG.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 2;
      pointer-events: none;
      animation: bgSlideDown 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes bgSlideDown {
      0% {
        top: -100%;
        opacity: 0;
      }
      100% {
        top: 0;
        opacity: 1;
      }
    }

    .bg-layer.hidden {
      display: none;
    }

    /* UI Info */
    .info {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 16px;
      border-radius: 8px;
      z-index: 30;
      font-weight: 500;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #aaa;
    }

    .status.active {
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Video background -->
    <video id="video" autoplay playsinline></video>

    <!-- Background image layer (slides down when hand raised) -->
    <div class="bg-layer hidden" id="bgLayer"></div>

    <!-- Canvas for pose visualization (optional) -->
    <canvas id="canvas"></canvas>

    <!-- Speech bubble (hidden by default) -->
    <div class="speech-bubble" id="speechBubble" style="display: none;">질문있습니다!</div>

    <!-- Microphone container -->
    <div class="microphone-container" id="micContainer"></div>

    <!-- Grain effect -->
    <div id="grain"></div>

    <!-- Info panel -->
    <div class="info">
      <div>손을 올려서 질문하세요!</div>
      <div class="status" id="status">카메라 초기화 중...</div>
    </div>
  </div>

  <!-- MediaPipe Pose -->
  <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <!-- MediaPipe Selfie Segmentation -->
  <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

  <script>
    // ============================================
    // SELFIE SEGMENTATION & HAND RAISE LOGIC
    // ============================================
    class PressConferenceFilter {
      constructor() {
        this.video = document.getElementById('video');
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.speechBubble = document.getElementById('speechBubble');
        this.micContainer = document.getElementById('micContainer');
        this.bgLayer = document.getElementById('bgLayer');
        this.statusEl = document.getElementById('status');

        this.pose = null;
        this.segmentation = null;
        this.camera = null;
        this.isActive = false;
        this.handRaisedTime = 0;
        this.triggerThreshold = 200; // 0.2 seconds
        this.microphones = [];
        this.lastTriggerTime = 0;
        this.triggerCooldown = 2000; // 2 seconds

        this.setupCanvas();
        this.initModels();
      }

      setupCanvas() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
          this.canvas.width = window.innerWidth;
          this.canvas.height = window.innerHeight;
        });
      }

      async initModels() {
        try {
          // Initialize Pose
          this.pose = new Pose({
            locateFile: (file) => {
              return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
            }
          });

          this.pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            smoothSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });

          // Initialize Selfie Segmentation
          this.segmentation = new SelfieSegmentation({
            locateFile: (file) => {
              return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
            }
          });

          this.segmentation.setOptions({
            modelSelection: 1, // 1 = landscape model (더 빠름)
            selfieMode: true
          });

          // Setup camera
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 } }
          });

          this.video.srcObject = stream;
          this.video.onloadedmetadata = () => {
            this.camera = new Camera(this.video, {
              onFrame: async () => {
                // Run both models
                await this.pose.send({ image: this.video });
                await this.segmentation.send({ image: this.video });
              },
              width: 1280,
              height: 720
            });
            this.camera.start();
            this.statusEl.textContent = '준비 완료!';
            this.statusEl.classList.add('active');
          };

          // Callbacks
          this.pose.onResults(this.onPoseResults.bind(this));
          this.segmentation.onResults(this.onSegmentationResults.bind(this));
        } catch (error) {
          console.error('모델 초기화 실패:', error);
          this.statusEl.textContent = '초기화 실패';
        }
      }

      onSegmentationResults(results) {
        if (!results.segmentationMask) return;

        // Clear canvas
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw video frame to canvas
        this.ctx.drawImage(this.video, 0, 0, this.canvas.width, this.canvas.height);

        // Get segmentation mask
        const mask = results.segmentationMask;
        const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
        const data = imageData.data;

        // Apply mask to alpha channel
        const maskData = new Uint8ClampedArray(mask.data);
        
        for (let i = 0; i < maskData.length; i++) {
          const maskValue = maskData[i];
          const pixelIndex = i * 4;

          // If not person (maskValue < 128), make transparent
          if (maskValue < 128) {
            data[pixelIndex + 3] = 0; // Set alpha to 0
          }
        }

        this.ctx.putImageData(imageData, 0, 0);
      }

      onPoseResults(results) {
        if (!results.poseLandmarks) return;

        const landmarks = results.poseLandmarks;

        // Get key points
        const rightWrist = landmarks[16];
        const rightShoulder = landmarks[12];
        const leftWrist = landmarks[15];
        const leftShoulder = landmarks[11];

        // Check if hand is raised
        const rightHandRaised = rightWrist.y < rightShoulder.y - 0.1 && rightWrist.visibility > 0.5;
        const leftHandRaised = leftWrist.y < leftShoulder.y - 0.1 && leftWrist.visibility > 0.5;
        const handRaised = rightHandRaised || leftHandRaised;

        // Track hand raise duration
        if (handRaised) {
          if (this.handRaisedTime === 0) {
            this.handRaisedTime = Date.now();
          }

          const raisedDuration = Date.now() - this.handRaisedTime;

          // Trigger if hand raised for threshold time
          if (raisedDuration > this.triggerThreshold && !this.isActive) {
            const now = Date.now();
            if (now - this.lastTriggerTime > this.triggerCooldown) {
              console.log('✅ TRIGGER!');
              this.trigger();
              this.lastTriggerTime = now;
            }
          }
        } else {
          this.handRaisedTime = 0;
        }
      }

      trigger() {
        this.isActive = true;

        // Show background image
        this.bgLayer.classList.remove('hidden');
        this.bgLayer.style.animation = 'none';
        setTimeout(() => {
          this.bgLayer.style.animation = 'bgSlideDown 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
        }, 10);

        // Show speech bubble
        this.speechBubble.style.display = 'block';
        this.speechBubble.style.animation = 'none';
        setTimeout(() => {
          this.speechBubble.style.animation = 'bubblePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
        }, 10);

        // Create microphones
        this.createMicrophones();

        // Reset after 2 seconds
        setTimeout(() => {
          this.reset();
        }, 2000);
      }

      createMicrophones() {
        this.micContainer.innerHTML = '';
        this.microphones = [];

        // Create single microphone at center bottom
        const mic = document.createElement('div');
        mic.className = 'microphone floating';

        const img = document.createElement('img');
        img.src = './micmic.png';
        img.alt = 'microphone';
        img.onerror = () => {
          console.error('❌ 마이크 이미지 로드 실패:', './micmic.png');
        };
        img.onload = () => {
          console.log('✅ 마이크 이미지 로드 성공');
        };

        mic.appendChild(img);
        this.micContainer.appendChild(mic);
        this.microphones.push(mic);
      }

      reset() {
        this.isActive = false;
        this.speechBubble.style.display = 'none';
        this.bgLayer.classList.add('hidden');
        this.micContainer.innerHTML = '';
        this.microphones = [];
      }
    }

    // Initialize on page load
    window.addEventListener('load', () => {
      new PressConferenceFilter();
    });
  </script>
</body>
</html>
