<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Press Conference Camera Filter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Background image layer - video 위에 겹침 */
    .bg-layer {
      position: fixed;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('./BG.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 2;
      pointer-events: none;
      animation: bgSlideDown 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      mix-blend-mode: lighten;
    }

    @keyframes bgSlideDown {
      0% {
        top: -100%;
        opacity: 0;
      }
      100% {
        top: 0;
        opacity: 1;
      }
    }

    .bg-layer.hidden {
      display: none;
    }

    /* Video background layer */
    #video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      filter: contrast(1.1) brightness(0.95);
      z-index: 3;
    }

    /* Canvas overlay */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      display: none;
    }

    /* Speech bubble */
    .speech-bubble {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: #fff;
      border: 3px solid #000;
      border-radius: 20px;
      padding: 20px 30px;
      font-size: 32px;
      font-weight: 900;
      color: #000;
      white-space: nowrap;
      box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.3);
      z-index: 10;
      animation: bubblePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes bubblePop {
      0% {
        transform: translateX(-50%) scale(0) rotate(-10deg);
        opacity: 0;
      }
      50% {
        transform: translateX(-50%) scale(1.1) rotate(5deg);
      }
      100% {
        transform: translateX(-50%) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 30px;
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 0 solid transparent;
      border-top: 15px solid #fff;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 27px;
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 0 solid transparent;
      border-top: 18px solid #000;
    }

    /* Microphone container - 이미지 하단이 화면 하단에 맞닿음 */
    .microphone-container {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 1000px;
      pointer-events: none;
      z-index: 5;
      overflow: visible;
    }

    .microphone {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      animation: micRise 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .microphone img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes micRise {
      0% {
        transform: translateY(300px) scale(0.3);
        opacity: 0;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .microphone.floating {
      animation: micRise 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, float 2s ease-in-out 0.5s infinite;
    }

    /* Grain effect */
    #grain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.03;
      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/></filter><rect width="100" height="100" fill="black" filter="url(%23noise)"/></svg>');
      z-index: 20;
    }

    /* Info panel */
    .info {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 16px;
      border-radius: 8px;
      z-index: 30;
      font-weight: 500;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #aaa;
    }

    .status.active {
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Background image layer -->
    <div class="bg-layer hidden" id="bgLayer"></div>

    <!-- Video background -->
    <video id="video" autoplay playsinline></video>

    <!-- Canvas -->
    <canvas id="canvas"></canvas>

    <!-- Speech bubble -->
    <div class="speech-bubble" id="speechBubble" style="display: none;">질문있습니다!</div>

    <!-- Microphone container -->
    <div class="microphone-container" id="micContainer"></div>

    <!-- Grain effect -->
    <div id="grain"></div>

    <!-- Info panel -->
    <div class="info">
      <div>손을 올려서 질문하세요!</div>
      <div class="status" id="status">카메라 초기화 중...</div>
    </div>
  </div>

  <!-- MediaPipe Pose -->
  <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

  <script>
    class PressConferenceFilter {
      constructor() {
        this.video = document.getElementById('video');
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.speechBubble = document.getElementById('speechBubble');
        this.micContainer = document.getElementById('micContainer');
        this.bgLayer = document.getElementById('bgLayer');
        this.statusEl = document.getElementById('status');

        this.pose = null;
        this.camera = null;
        this.isActive = false;
        this.handRaisedTime = 0;
        this.triggerThreshold = 200;
        this.lastTriggerTime = 0;
        this.triggerCooldown = 2000;

        this.setupCanvas();
        this.initPose();
      }

      setupCanvas() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
          this.canvas.width = window.innerWidth;
          this.canvas.height = window.innerHeight;
        });
      }

      async initPose() {
        try {
          this.pose = new Pose({
            locateFile: (file) => {
              return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
            }
          });

          this.pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });

          this.pose.onResults(this.onPoseResults.bind(this));

          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 } }
          });

          this.video.srcObject = stream;
          this.video.onloadedmetadata = () => {
            this.camera = new Camera(this.video, {
              onFrame: async () => {
                await this.pose.send({ image: this.video });
              },
              width: 1280,
              height: 720
            });
            this.camera.start();
            this.statusEl.textContent = '준비 완료!';
            this.statusEl.classList.add('active');
          };
        } catch (error) {
          console.error('초기화 실패:', error);
          this.statusEl.textContent = '초기화 실패';
        }
      }

      onPoseResults(results) {
        if (!results.poseLandmarks) return;

        const landmarks = results.poseLandmarks;
        const rightWrist = landmarks[16];
        const rightShoulder = landmarks[12];
        const leftWrist = landmarks[15];
        const leftShoulder = landmarks[11];

        const rightHandRaised = rightWrist.y < rightShoulder.y - 0.1 && rightWrist.visibility > 0.5;
        const leftHandRaised = leftWrist.y < leftShoulder.y - 0.1 && leftWrist.visibility > 0.5;
        const handRaised = rightHandRaised || leftHandRaised;

        if (handRaised) {
          if (this.handRaisedTime === 0) {
            this.handRaisedTime = Date.now();
          }

          const raisedDuration = Date.now() - this.handRaisedTime;

          if (raisedDuration > this.triggerThreshold && !this.isActive) {
            const now = Date.now();
            if (now - this.lastTriggerTime > this.triggerCooldown) {
              this.trigger();
              this.lastTriggerTime = now;
            }
          }
        } else {
          this.handRaisedTime = 0;
        }
      }

      trigger() {
        this.isActive = true;

        // Show BG
        this.bgLayer.classList.remove('hidden');
        console.log('✅ BG 표시됨');
        console.log('BG 요소:', this.bgLayer);
        console.log('BG 배경이미지:', window.getComputedStyle(this.bgLayer).backgroundImage);
        
        this.bgLayer.style.animation = 'none';
        setTimeout(() => {
          this.bgLayer.style.animation = 'bgSlideDown 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
        }, 10);

        // Show speech bubble
        this.speechBubble.style.display = 'block';
        this.speechBubble.style.animation = 'none';
        setTimeout(() => {
          this.speechBubble.style.animation = 'bubblePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
        }, 10);

        // Create microphone
        this.createMicrophone();

        // Reset after 2 seconds
        setTimeout(() => {
          this.reset();
        }, 2000);
      }

      createMicrophone() {
        this.micContainer.innerHTML = '';

        const mic = document.createElement('div');
        mic.className = 'microphone floating';

        const img = document.createElement('img');
        img.src = './micmic.png';
        img.alt = 'microphone';

        mic.appendChild(img);
        this.micContainer.appendChild(mic);
      }

      reset() {
        this.isActive = false;
        this.speechBubble.style.display = 'none';
        this.bgLayer.classList.add('hidden');
        this.micContainer.innerHTML = '';
      }
    }

    window.addEventListener('load', () => {
      new PressConferenceFilter();
    });
  </script>
</body>
</html>
