<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metaball Typography</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #000;
      font-family: 'Arial Black', sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let blobs = [];
    let anchorPoints = [];
    let currentWord = 'YALE';
    const words = ['YALE', 'BLOB', 'FLOW', 'MELT'];
    let wordIndex = 0;
    
    // Grid settings
    const gridSize = 3;
    let gridWidth, gridHeight;
    
    // Mouse
    let mouseX = -1000;
    let mouseY = -1000;
    
    function init() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      
      gridWidth = Math.ceil(width / gridSize);
      gridHeight = Math.ceil(height / gridSize);
      
      extractAnchorPoints(currentWord);
      createBlobs();
    }
    
    function extractAnchorPoints(text) {
      anchorPoints = [];
      
      // Temporary canvas
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = width;
      tempCanvas.height = height;
      const tempCtx = tempCanvas.getContext('2d');
      
      // Draw text
      tempCtx.fillStyle = '#fff';
      tempCtx.font = 'bold 200px Arial Black';
      tempCtx.textAlign = 'center';
      tempCtx.textBaseline = 'middle';
      tempCtx.fillText(text, width / 2, height / 2);
      
      // Sample pixels
      const imageData = tempCtx.getImageData(0, 0, width, height);
      const data = imageData.data;
      
      for (let y = 0; y < height; y += 8) {
        for (let x = 0; x < width; x += 8) {
          const index = (x + y * width) * 4;
          const alpha = data[index + 3];
          
          if (alpha > 128) {
            anchorPoints.push({ x, y });
          }
        }
      }
      
      console.log('Anchor points:', anchorPoints.length);
    }
    
    function createBlobs() {
      blobs = [];
      
      anchorPoints.forEach(anchor => {
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 60;
        
        blobs.push({
          x: anchor.x + Math.cos(angle) * distance,
          y: anchor.y + Math.sin(angle) * distance,
          anchorX: anchor.x,
          anchorY: anchor.y,
          vx: 0,
          vy: 0,
          radius: 10 + Math.random() * 4,
          phase: Math.random() * Math.PI * 2
        });
      });
    }
    
    function updateBlobs() {
      const time = Date.now() * 0.001;
      
      blobs.forEach(blob => {
        // Restore force to anchor
        const dx = blob.anchorX - blob.x;
        const dy = blob.anchorY - blob.y;
        blob.vx += dx * 0.025;
        blob.vy += dy * 0.025;
        
        // Floating motion (sin/cos)
        blob.vx += Math.sin(time + blob.phase) * 0.025;
        blob.vy += Math.cos(time + blob.phase * 1.3) * 0.025;
        
        // Mouse repulsion
        const mdx = blob.x - mouseX;
        const mdy = blob.y - mouseY;
        const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
        
        if (mdist < 80 && mdist > 0) {
          const force = (80 - mdist) / 80;
          blob.vx += (mdx / mdist) * force * 1.5;
          blob.vy += (mdy / mdist) * force * 1.5;
        }
        
        // Damping
        blob.vx *= 0.82;
        blob.vy *= 0.82;
        
        // Update position
        blob.x += blob.vx;
        blob.y += blob.vy;
      });
    }
    
    function renderMetaball() {
      // Clear
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);
      
      // Calculate grid
      const grid = new Array(gridWidth * gridHeight).fill(0);
      
      for (let gy = 0; gy < gridHeight; gy++) {
        for (let gx = 0; gx < gridWidth; gx++) {
          const px = gx * gridSize;
          const py = gy * gridSize;
          
          let sum = 0;
          
          // Calculate influence from all blobs
          for (let i = 0; i < blobs.length; i++) {
            const blob = blobs[i];
            const dx = px - blob.x;
            const dy = py - blob.y;
            const distSq = dx * dx + dy * dy + 1;
            const radiusSq = blob.radius * blob.radius;
            
            sum += radiusSq / distSq;
          }
          
          grid[gx + gy * gridWidth] = sum;
        }
      }
      
      // Draw filled cells
      ctx.fillStyle = '#fff';
      for (let gy = 0; gy < gridHeight; gy++) {
        for (let gx = 0; gx < gridWidth; gx++) {
          const sum = grid[gx + gy * gridWidth];
          
          if (sum > 1.0) {
            ctx.fillRect(gx * gridSize, gy * gridSize, gridSize, gridSize);
          }
        }
      }
    }
    
    function animate() {
      updateBlobs();
      renderMetaball();
      requestAnimationFrame(animate);
    }
    
    // Events
    canvas.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });
    
    canvas.addEventListener('mouseleave', () => {
      mouseX = -1000;
      mouseY = -1000;
    });
    
    canvas.addEventListener('click', () => {
      wordIndex = (wordIndex + 1) % words.length;
      currentWord = words[wordIndex];
      extractAnchorPoints(currentWord);
      
      // Reassign anchors to existing blobs
      if (blobs.length > anchorPoints.length) {
        blobs = blobs.slice(0, anchorPoints.length);
      } else if (blobs.length < anchorPoints.length) {
        const diff = anchorPoints.length - blobs.length;
        for (let i = 0; i < diff; i++) {
          const anchor = anchorPoints[blobs.length + i];
          blobs.push({
            x: anchor.x,
            y: anchor.y,
            anchorX: anchor.x,
            anchorY: anchor.y,
            vx: 0,
            vy: 0,
            radius: 10 + Math.random() * 4,
            phase: Math.random() * Math.PI * 2
          });
        }
      }
      
      // Update anchors
      blobs.forEach((blob, i) => {
        if (i < anchorPoints.length) {
          blob.anchorX = anchorPoints[i].x;
          blob.anchorY = anchorPoints[i].y;
        }
      });
    });
    
    window.addEventListener('resize', () => {
      init();
    });
    
    // Start
    init();
    animate();
  </script>
</body>
</html>
